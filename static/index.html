<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS STUDIO · AI 视频创作系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0e12'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='%2357d9a3'>◈</text></svg>">
<link rel="stylesheet" href="/static/style.css?v=78">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">◈</span> NEXUS<span class="dim">STUDIO</span></div>
  <div class="projwrap">
    <select id="projSel" class="projsel"></select>
    <button class="btn ghost" data-act="newProject">+ 新项目</button>
    <select id="langSel" class="langsel" title="台词语言：写进 H3 提示词，按这个语言发音与口型">
      <option value="zh">台词：普通话</option>
      <option value="yue">台词：粤语/白话</option>
      <option value="hak">台词：客家话</option>
      <option value="en">台词：英语</option>
      <option value="nan">台词：闽南话</option>
      <option value="sichuan">台词：四川话</option>
    </select>
    <button class="btn" data-act="wizOpen">制作向导</button>
    <button class="btn" data-act="goAssets">资产库</button>
    <button class="btn ghost" data-act="showGuide">指南</button>
    <button class="btn ghost" data-act="community">社区交流</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="sync" id="sync"><i></i><span>连接中…</span></div>
</header>

<div class="epbar" id="epbar"></div>

<aside class="rail" id="rail"></aside>

<main class="work" id="work"></main>

<aside class="assets" id="assets"></aside>

<section class="console" id="console"></section>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>

<script src="/static/app.js?v=78"></script>
</body>
</html>
